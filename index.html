    <script>
      /* Suppress benign Vite HMR WebSocket connection errors in sandbox/preview environments */
      (function() {
        var isViteHmrError = function(msg, src) {
          var str = (msg || '') + ' ' + (src || '');
          return str.includes('@vite/client') ||
                 str.includes('WebSocket') ||
                 str.includes('createWebSocketModuleRunnerTransport') ||
                 str.includes('failed to connect to websocket');
        };

        window.addEventListener('error', function(e) {
          if (isViteHmrError(e.message, e.filename) || isViteHmrError(e.error && e.error.stack, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isViteHmrError(msg, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
